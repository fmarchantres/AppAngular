<app-plantilla>

  <!-- Título y descripción -->
  <div class="ion-text-center ion-padding">
    <p class="titulo">Registro</p>
    <p class="descripcion">Crea tu cuenta para acceder a SchoolEvents</p>
  </div>

  <!-- Formulario -->
  <form #form="ngForm" (ngSubmit)="register(form)">
    <ion-grid>
      <ion-row class="ion-justify-content-center ion-align-items-center">
        <ion-col size-md="6" size-lg="5" size-xs="12">

          <!-- Inputs con padding y fondo blanco -->
          <div class="login-card ion-padding">
            <ion-item>
              <ion-label position="stacked">Nombre</ion-label>
              <ion-input
                name="nombre"
                type="text"
                placeholder="Tu nombre"
                ngModel
                required>
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="stacked">Primer apellido</ion-label>
              <ion-input
                name="primerApellido"
                type="text"
                placeholder="Tu primer apellido"
                ngModel
                required>
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="stacked">Segundo apellido</ion-label>
              <ion-input
                name="segundoApellido"
                type="text"
                placeholder="Tu segundo apellido"
                ngModel>
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="stacked">Email</ion-label>
              <ion-input
                name="email"
                type="email"
                placeholder="tu@email.com"
                ngModel
                required>
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="stacked">Contraseña</ion-label>
              <ion-input
                name="password"
                type="password"
                placeholder="Password"
                ngModel
                required>
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="stacked">Confirmar contraseña</ion-label>
              <ion-input
                name="confirmPassword"
                type="password"
                placeholder="Repite tu contraseña"
                ngModel
                required>
              </ion-input>
            </ion-item>
          </div>

          <!-- Botón de registro -->
          <div class="ion-padding">
            <ion-button
              class="boton-registrar"
              [class.form-valido]="form.valid"
              size="large"
              type="submit"
              [disabled]="form.invalid"
              expand="block">
              Registrarse
            </ion-button>
          </div>


        </ion-col>
      </ion-row>
    </ion-grid>
  </form>

  <!-- Link a login -->
  <div class="ion-text-center ion-padding">
    <a [routerLink]="'/pag-login'">¿Ya tienes una cuenta? Inicia sesión aquí.</a>
  </div>

</app-plantilla>
