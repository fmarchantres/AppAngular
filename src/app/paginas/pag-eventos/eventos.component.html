<app-plantilla>
  <div>
    <p class="titulo_eventos">Próximos Eventos</p>
  </div>

<div class="eventos">
  <!-- LISTA DINÁMICA DE EVENTOS (SOLO IMÁGENES CLICKABLES) -->
  <div class="evento-dinamico" *ngFor="let ev of eventos">
    <img
      [src]="ev.urlImagen || 'assets/pag-eventos/generico.jpg'"
      alt="Evento genérico"
      class="imagen-evento"
      [routerLink]="['/evento', ev.id]"
    >

    <p class="nombre-evento" [routerLink]="['/evento',ev.id]"> {{ ev.nombre }}</p>
  </div>
</div>

</app-plantilla>
