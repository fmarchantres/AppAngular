<app-plantilla>
  <div class="contenido-calendario">
    <p class="titulo">Calendario</p>
    <p class="descripcion">Mira aquí los próximos eventos</p>


    <ion-datetime
      presentation="date"
      [(ngModel)]="datetime"
      class="calendario"
    ></ion-datetime>

    <p class="fecha-seleccionada" *ngIf="datetime">
      Fecha seleccionada: {{ datetime | date:'fullDate' }}
    </p>
  </div>
</app-plantilla>
