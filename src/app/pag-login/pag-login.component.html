<app-plantilla>

  <!-- Título y descripción -->
  <div class="ion-text-center ion-padding">
    <p class="titulo">Iniciar Sesión</p>
    <p class="descripcion">Introduce tu correo electrónico para acceder a SchoolEvents</p>
  </div>

  <!-- Formulario -->
  <form #form="ngForm" (ngSubmit)="login(form)">
    <ion-grid>
      <ion-row class="ion-justify-content-center ion-align-items-center">
        <ion-col size-md="6" size-lg="5" size-xs="12">

          <!-- Inputs con padding y fondo blanco -->
          <div class="login-card ion-padding">
            <ion-item>
              <ion-label position="stacked">Email</ion-label>
              <ion-input
                name="email"
                type="email"
                placeholder="your@email.com"
                ngModel
                required>
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="stacked">Contraseña</ion-label>
              <ion-input
                name="password"
                type="password"
                placeholder="Password"
                ngModel
                required>
              </ion-input>
            </ion-item>
          </div>

          <!-- Botón Login -->
          <div class="ion-padding">
            <ion-button
              size="large"
              type="submit"
              [disabled]="form.invalid"
              expand="block"
              color="primary">
              Login
            </ion-button>
          </div>

        </ion-col>
      </ion-row>
    </ion-grid>
  </form>

  <!-- Link a registro -->
  <div class="ion-text-center ion-padding">
    <a [routerLink]="'/pag-registro'">¿No tienes cuenta? Regístrate aqui.</a>
  </div>

</app-plantilla>
